<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轻量级论坛 - JSON数据库版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 30px;
            text-align: center;
        }
        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }
        nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 25px;
            transition: all 0.3s ease;
        }
        nav a:hover {
            background: rgba(255,255,255,0.2);
            transform: translateY(-2px);
        }
        .user-info {
            background: rgba(255,255,255,0.1);
            padding: 10px 20px;
            border-radius: 20px;
            margin-top: 10px;
        }
        main {
            padding: 30px;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #3498db;
            transition: transform 0.3s ease;
        }
        .card:hover {
            transform: translateX(5px);
        }
        .post-title {
            font-size: 1.3em;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .post-content {
            color: #555;
            line-height: 1.6;
            margin-bottom: 15px;
        }
        .post-meta {
            color: #7f8c8d;
            font-size: 0.9em;
            border-top: 1px solid #ecf0f1;
            padding-top: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input, textarea, button {
            width: 100%;
            padding: 15px;
            border: 2px solid #ecf0f1;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
            box-shadow: 0 0 10px rgba(52, 152, 219, 0.2);
        }
        button {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.4);
        }
        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
        }
        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }
        .reply-section {
            background: #ecf0f1;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }
        .reply {
            background: white;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid #27ae60;
        }
        .hidden {
            display: none;
        }
        .loading {
            text-align: center;
            padding: 20px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🌐 轻量级论坛</h1>
            <p>基于JSON数据库的多用户论坛系统</p>
            <nav>
                <a href="#" onclick="showSection('home')">🏠 首页</a>
                <a href="#" onclick="showSection('new-post')" id="new-post-link" class="hidden">📝 发帖</a>
                <a href="#" onclick="showSection('login')" id="login-link">🔑 登录</a>
                <a href="#" onclick="showSection('register')" id="register-link">👤 注册</a>
                <div class="user-info hidden" id="user-info">
                    欢迎, <span id="username-display"></span>
                    <a href="#" onclick="logout()" style="margin-left:10px;">🚪 退出</a>
                </div>
            </nav>
        </header>

        <main>
            <!-- 首页 -->
            <div id="home" class="section active">
                <div class="stats">
                    <div class="stat-card">
                        <span class="stat-number" id="total-posts">0</span>
                        总帖子
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="total-users">0</span>
                        总用户
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="online-users">0</span>
                        在线用户
                    </div>
                </div>
                <h2>📋 最新帖子</h2>
                <div id="posts-list" class="loading">正在加载帖子...</div>
            </div>

            <!-- 登录表单 -->
            <div id="login" class="section">
                <h2>🔑 用户登录</h2>
                <div id="login-message"></div>
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <input type="text" id="login-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="login-password" placeholder="请输入密码" required>
                    </div>
                    <button type="submit">登录</button>
                </form>
                <p style="text-align:center; margin-top:15px;">还没有账号？<a href="#" onclick="showSection('register')">立即注册</a></p>
            </div>

            <!-- 注册表单 -->
            <div id="register" class="section">
                <h2>👤 用户注册</h2>
                <div id="register-message"></div>
                <form onsubmit="register(event)">
                    <div class="form-group">
                        <input type="text" id="register-username" placeholder="请输入用户名" required>
                    </div>
                    <div class="form-group">
                        <input type="email" id="register-email" placeholder="请输入邮箱" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="register-password" placeholder="请输入密码（至少6位）" required>
                    </div>
                    <div class="form-group">
                        <input type="password" id="register-confirm-password" placeholder="请确认密码" required>
                    </div>
                    <button type="submit">注册</button>
                </form>
                <p style="text-align:center; margin-top:15px;">已有账号？<a href="#" onclick="showSection('login')">立即登录</a></p>
            </div>

            <!-- 发帖表单 -->
            <div id="new-post" class="section">
                <h2>📝 发布新帖</h2>
                <div id="new-post-message"></div>
                <form onsubmit="createPost(event)">
                    <div class="form-group">
                        <input type="text" id="post-title" placeholder="请输入帖子标题" required>
                    </div>
                    <div class="form-group">
                        <textarea id="post-content" placeholder="请输入帖子内容..." rows="10" required></textarea>
                    </div>
                    <button type="submit">发布帖子</button>
                </form>
            </div>

            <!-- 帖子详情 -->
            <div id="post-detail" class="section">
                <div id="post-content-detail"></div>
                <div id="replies-section" class="reply-section hidden">
                    <h3>💬 回复</h3>
                    <div id="replies-list"></div>
                    <div class="form-group">
                        <textarea id="reply-content" placeholder="写下你的回复..." rows="3"></textarea>
                        <button onclick="addReply()">发表回复</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        // JSON数据库模拟
        class JSONDatabase {
            constructor() {
                this.dbName = 'forum_database';
                this.init();
            }

            init() {
                if (!localStorage.getItem(this.dbName)) {
                    // 初始化数据库结构
                    const initialDB = {
                        users: [],
                        posts: [],
                        sessions: []
                    };
                    this.save(initialDB);
                }
            }

            get() {
                return JSON.parse(localStorage.getItem(this.dbName) || '{}');
            }

            save(data) {
                localStorage.setItem(this.dbName, JSON.stringify(data));
            }

            // 用户操作
            addUser(user) {
                const db = this.get();
                user.id = Date.now().toString();
                user.createdAt = new Date().toISOString();
                db.users.push(user);
                this.save(db);
                return user;
            }

            findUserByUsername(username) {
                const db = this.get();
                return db.users.find(u => u.username === username);
            }

            // 帖子操作
            addPost(post) {
                const db = this.get();
                post.id = Date.now().toString();
                post.createdAt = new Date().toISOString();
                post.replies = [];
                db.posts.unshift(post); // 新帖子放在前面
                this.save(db);
                return post;
            }

            getPosts() {
                const db = this.get();
                return db.posts || [];
            }

            getPostById(id) {
                const db = this.get();
                return db.posts.find(p => p.id === id);
            }

            // 回复操作
            addReply(postId, reply) {
                const db = this.get();
                const post = db.posts.find(p => p.id === postId);
                if (post) {
                    reply.id = Date.now().toString();
                    reply.createdAt = new Date().toISOString();
                    post.replies.push(reply);
                    this.save(db);
                    return reply;
                }
                return null;
            }

            // 会话管理
            createSession(user) {
                const db = this.get();
                const session = {
                    id: Date.now().toString(),
                    userId: user.id,
                    username: user.username,
                    createdAt: new Date().toISOString(),
                    lastActive: new Date().toISOString()
                };
                db.sessions.push(session);
                this.save(db);
                return session;
            }

            getActiveSessions() {
                const db = this.get();
                const fiveMinutesAgo = new Date(Date.now() - 5 * 60 * 1000).toISOString();
                return db.sessions.filter(s => s.lastActive > fiveMinutesAgo);
            }
        }

        // 创建数据库实例
        const db = new JSONDatabase();

        // 工具函数
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(section => {
                section.classList.remove('active');
            });
            document.getElementById(sectionId).classList.add('active');
            
            if (sectionId === 'home') {
                loadHomePage();
            }
        }

        function showAlert(elementId, message, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
        }

        function updateUI() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (currentUser) {
                document.getElementById('user-info').classList.remove('hidden');
                document.getElementById('username-display').textContent = currentUser.username;
                document.getElementById('login-link').classList.add('hidden');
                document.getElementById('register-link').classList.add('hidden');
                document.getElementById('new-post-link').classList.remove('hidden');
            } else {
                document.getElementById('user-info').classList.add('hidden');
                document.getElementById('login-link').classList.remove('hidden');
                document.getElementById('register-link').classList.remove('hidden');
                document.getElementById('new-post-link').classList.add('hidden');
            }
        }

        // 用户注册
        function register(event) {
            event.preventDefault();
            
            const username = document.getElementById('register-username').value.trim();
            const email = document.getElementById('register-email').value.trim();
            const password = document.getElementById('register-password').value;
            const confirmPassword = document.getElementById('register-confirm-password').value;

            if (password !== confirmPassword) {
                showAlert('register-message', '密码不匹配', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('register-message', '密码至少需要6个字符', 'error');
                return;
            }

            if (db.findUserByUsername(username)) {
                showAlert('register-message', '用户名已存在', 'error');
                return;
            }

            const newUser = {
                username,
                email,
                password: btoa(password) // 简单base64编码，实际项目请使用更安全的方法
            };

            db.addUser(newUser);
            showAlert('register-message', '注册成功！请登录', 'success');
            
            setTimeout(() => showSection('login'), 1500);
        }

        // 用户登录
        function login(event) {
            event.preventDefault();
            
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            const user = db.findUserByUsername(username);
            if (user && user.password === btoa(password)) {
                const session = db.createSession(user);
                localStorage.setItem('currentUser', JSON.stringify({
                    id: user.id,
                    username: user.username
                }));
                
                showAlert('login-message', '登录成功！', 'success');
                updateUI();
                
                setTimeout(() => showSection('home'), 1000);
            } else {
                showAlert('login-message', '用户名或密码错误', 'error');
            }
        }

        // 用户退出
        function logout() {
            localStorage.removeItem('currentUser');
            updateUI();
            showSection('home');
        }

        // 创建帖子
        function createPost(event) {
            event.preventDefault();
            
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                showAlert('new-post-message', '请先登录', 'error');
                return;
            }

            const title = document.getElementById('post-title').value.trim();
            const content = document.getElementById('post-content').value.trim();

            if (!title || !content) {
                showAlert('new-post-message', '标题和内容都是必填的', 'error');
                return;
            }

            const newPost = {
                title,
                content,
                userId: currentUser.id,
                username: currentUser.username
            };

            db.addPost(newPost);
            showAlert('new-post-message', '帖子发布成功！', 'success');
            
            document.getElementById('post-title').value = '';
            document.getElementById('post-content').value = '';
            
            setTimeout(() => {
                showSection('home');
                loadHomePage();
            }, 1000);
        }

        // 加载首页
        function loadHomePage() {
            const posts = db.getPosts();
            const users = db.get().users || [];
            const activeSessions = db.getActiveSessions();

            // 更新统计信息
            document.getElementById('total-posts').textContent = posts.length;
            document.getElementById('total-users').textContent = users.length;
            document.getElementById('online-users').textContent = activeSessions.length;

            // 显示帖子列表
            const postsList = document.getElementById('posts-list');
            if (posts.length === 0) {
                postsList.innerHTML = `
                    <div class="card">
                        <div class="post-content" style="text-align:center; padding:40px;">
                            <h3>还没有帖子</h3>
                            <p>成为第一个发帖的人吧！</p>
                            <button onclick="showSection('new-post')" style="width:auto; margin:20px auto;">发布第一个帖子</button>
                        </div>
                    </div>
                `;
            } else {
                postsList.innerHTML = posts.map(post => `
                    <div class="card" onclick="viewPost('${post.id}')" style="cursor:pointer;">
                        <div class="post-title">${escapeHtml(post.title)}</div>
                        <div class="post-content">${escapeHtml(post.content.substring(0, 150))}${post.content.length > 150 ? '...' : ''}</div>
                        <div class="post-meta">
                            👤 作者: ${escapeHtml(post.username)} | 
                            📅 发布时间: ${formatDate(post.createdAt)} |
                            💬 回复: ${post.replies ? post.replies.length : 0}
                        </div>
                    </div>
                `).join('');
            }
        }

        // 查看帖子详情
        function viewPost(postId) {
            const post = db.getPostById(postId);
            if (!post) return;

            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            
            document.getElementById('post-content-detail').innerHTML = `
                <div class="card">
                    <div class="post-title">${escapeHtml(post.title)}</div>
                    <div class="post-content">${escapeHtml(post.content).replace(/\n/g, '<br>')}</div>
                    <div class="post-meta">
                        👤 作者: ${escapeHtml(post.username)} | 
                        📅 发布时间: ${formatDate(post.createdAt)}
                    </div>
                </div>
            `;

            const repliesSection = document.getElementById('replies-section');
            if (currentUser) {
                repliesSection.classList.remove('hidden');
                loadReplies(postId);
                repliesSection.dataset.postId = postId;
            } else {
                repliesSection.classList.add('hidden');
            }

            showSection('post-detail');
        }

        // 加载回复
        function loadReplies(postId) {
            const post = db.getPostById(postId);
            const repliesList = document.getElementById('replies-list');

            if (!post.replies || post.replies.length === 0) {
                repliesList.innerHTML = '<p style="text-align:center; color:#7f8c8d;">暂无回复</p>';
                return;
            }

            repliesList.innerHTML = post.replies.map(reply => `
                <div class="reply">
                    <div class="post-content">${escapeHtml(reply.content).replace(/\n/g, '<br>')}</div>
                    <div class="post-meta">
                        👤 ${escapeHtml(reply.username)} | 
                        📅 ${formatDate(reply.createdAt)}
                    </div>
                </div>
            `).join('');
        }

        // 添加回复
        function addReply() {
            const currentUser = JSON.parse(localStorage.getItem('currentUser'));
            if (!currentUser) {
                alert('请先登录');
                return;
            }

            const postId = document.getElementById('replies-section').dataset.postId;
            const content = document.getElementById('reply-content').value.trim();

            if (!content) {
                alert('回复内容不能为空');
                return;
            }

            const reply = {
                content,
                userId: currentUser.id,
                username: currentUser.username
            };

            db.addReply(postId, reply);
            document.getElementById('reply-content').value = '';
            loadReplies(postId);
        }

        // 工具函数
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return `${Math.floor(diff / 60000)}分钟前`;
            if (diff < 86400000) return `${Math.floor(diff / 3600000)}小时前`;
            
            return `${date.getFullYear()}-${(date.getMonth() + 1).toString().padStart(2, '0')}-${date.getDate().toString().padStart(2, '0')} ${date.getHours().toString().padStart(2, '0')}:${date.getMinutes().toString().padStart(2, '0')}`;
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            updateUI();
            loadHomePage();
            
            // 模拟一些初始数据（仅用于演示）
            if (db.getPosts().length === 0) {
                db.addPost({
                    title: '欢迎来到轻量级论坛！',
                    content: '这是一个基于JSON文件的论坛系统，所有用户都可以看到彼此发布的内容。\n\n功能特点：\n✅ 用户注册登录\n✅ 发布帖子\n✅ 回复帖子\n✅ 实时统计\n✅ 优美的界面',
                    userId: 'system',
                    username: '系统管理员'
                });
                loadHomePage();
            }
        });
    </script>
</body>
</html>
